name: CI

# Runs the test gates from specs/17 §17.5. The always-on jobs (openapi-lint,
# firestore-rules) exercise the artifacts that exist today; the backend / frontend /
# e2e jobs auto-activate via the `detect` job's file-existence outputs once that code
# lands in Phase 1+ (hashFiles() is step-scope only — it cannot be used in job-level
# `if:`), so the pipeline stays green on the current (spec-only) repo.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEMO_PROJECT: demo-benefitservicing-workbench

jobs:
  detect:
    name: Detect present components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      e2e: ${{ steps.check.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          backend=$([ -f backend/manage.py ] && echo true || echo false)
          frontend=$([ -f frontend/package.json ] && echo true || echo false)
          e2e=$([ "$backend" = true ] && [ "$frontend" = true ] && [ -f infrastructure/scripts/e2e.sh ] && echo true || echo false)
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint specs/openapi.yaml (Spectral)
        run: npx -y @stoplight/spectral-cli@^6 lint specs/openapi.yaml --fail-severity=error

  firestore-rules:
    name: Firestore security-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # firebase-tools requires Java 21+ for the emulators
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install firebase-tools
        run: npm i -g firebase-tools
      - name: Install deps
        working-directory: firebase
        run: npm install
      - name: Run rules tests against the Firestore emulator
        working-directory: firebase
        run: npm run test:rules:ci

  backend:
    name: Backend (unit + emulator integration)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install firebase-tools
        run: npm i -g firebase-tools
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Core unit tests (framework-free common/)
        working-directory: backend
        run: python -m unittest discover -s common/tests -p 'test_*.py' -t .
      - name: Tagged Django unit tests (Phase 2+)
        working-directory: backend
        run: python manage.py test --tag=unit
      - name: Emulator integration tests (transactions, idempotency gate, reconciliation, rules)
        run: >
          firebase emulators:exec --project=${{ env.DEMO_PROJECT }}
          --config firebase/firebase.json
          "python backend/manage.py test --tag=emulator"

  frontend:
    name: Frontend (lint + unit + build)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No committed package-lock.json yet (Phase 1 scaffold) → npm install, not npm ci.
      # Re-enable `cache: npm` + `npm ci` once a lockfile is generated & committed.
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (Vitest + RTL)
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright critical paths)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install firebase-tools
        run: npm i -g firebase-tools
      - name: Install frontend deps + Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # infrastructure/scripts/e2e.sh: seed the emulator, start Django + Next.js, run the
      # critical-path specs (specs/17 §17.4), tear down. Added in Phase 5.
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Critical-path E2E against the emulator
        run: >
          firebase emulators:exec --project=${{ env.DEMO_PROJECT }}
          --config firebase/firebase.json
          "bash infrastructure/scripts/e2e.sh"
